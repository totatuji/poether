<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>朝をもたらす</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e6edf3;color:#1f2778;font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}main{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}main::-webkit-scrollbar{display:none}#space{height:10000px;pointer-events:none}#words{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:7vw;z-index:2}#words p{margin:0;font-weight:400;font-size:clamp(17px,2.2vw,29px);line-height:1.9;letter-spacing:.07em;white-space:pre-line}#words.title p{font-size:clamp(27px,4vw,46px);letter-spacing:.13em}#words.author p{font-size:14px}#words.credit p{font:11px/2.1 sans-serif;letter-spacing:.08em}@media(max-width:600px){#words p{font-size:clamp(16px,4.7vw,22px)}#words.title p{font-size:clamp(25px,6.7vw,35px)}}
</style></head><body><canvas id="art" aria-hidden="true"></canvas><main id="reader" aria-label="朝をもたらす"><div id="space"></div></main><div id="words" class="title"><p>朝をもたらす</p></div><script>
'use strict';
const r=document.querySelector('#reader'),c=document.querySelector('#art'),x=c.getContext('2d'),words=document.querySelector('#words'),label=words.querySelector('p'),space=document.querySelector('#space');
const scenes=[{kind:'title',text:'朝をもたらす',length:1.25},{kind:'author',text:'久世孝臣',length:1},{kind:'blank',text:'',length:.65},{kind:'verse',text:'大きな鳥が',length:1.7},{kind:'verse',text:'部屋の中に入ってきて、',length:1.7},{kind:'verse',text:'眠っている私の声を\n借りて行った。',length:1.9},{kind:'verse',text:'鳥は私の声で朝を告げた。',length:1.9},{kind:'verse',text:'私はこの星に\n朝をもたらしたことがある',length:2.1},{kind:'verse',text:'声を持っている',length:2.3},{kind:'blank',text:'',length:.6},{kind:'credit',text:'POEM — TAKAOMI KUZE\nDESIGN / ILLUSTRATION — TOTA TSUJI',length:1.5},{kind:'blank',text:'',length:1.5}];
let total=0;for(const s of scenes){s.start=total;total+=s.length;}let w=0,h=0,d=1,p=0,target=0,raf=0,last=0,lastW=0;
const clamp=v=>Math.max(0,Math.min(1,v)),smooth=v=>v*v*(3-2*v),mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const noise=document.createElement('canvas');noise.width=noise.height=256;const nx=noise.getContext('2d'),nd=nx.createImageData(256,256);for(let i=0;i<nd.data.length;i+=4){const v=Math.random()*255;nd.data[i]=nd.data[i+1]=nd.data[i+2]=v;nd.data[i+3]=85}nx.putImageData(nd,0,0);
let pattern;const materials=['246,103,80','248,185,86','112,163,222','255,237,186','246,240,211','255,205,119'];
const edges=materials.map(()=>({angle:Math.random()*Math.PI*2,span:(180+Math.random()*110)*Math.PI/180}));edges[0]={angle:Math.PI/4,span:170*Math.PI/180};edges[1]={angle:Math.PI,span:240*Math.PI/180};edges[4].span=285*Math.PI/180;
// Cache masks using normalized radius and angle; render interpolated focus textures.
const N=280,geometry=new Float32Array(N*N*2);for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++){const u=(xx-N/2)/108,v=(yy-N/2)/108,j=(yy*N+xx)*2;geometry[j]=Math.hypot(u,v);geometry[j+1]=Math.atan2(v,u)}
const cache=new Map(),temp=document.createElement('canvas');temp.width=temp.height=N;const tx=temp.getContext('2d');
function texture(i,level){const key=i+':'+level;if(cache.has(key))return cache.get(key);const disc=document.createElement('canvas');disc.width=disc.height=N;const dx=disc.getContext('2d'),im=dx.createImageData(N,N),edge=edges[i],col=materials[i].split(',').map(Number),focus=level/16;for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++){const j=yy*N+xx,u=(xx-N/2)/108,v=(yy-N/2)/108,rr=geometry[j*2],angle=geometry[j*2+1],delta=Math.abs(Math.atan2(Math.sin(angle-edge.angle),Math.cos(angle-edge.angle))),hard=(1-smooth(clamp((delta-edge.span*.5+.13)/.26)))*focus,feather=.38*(1-hard)+.005*hard,boundary=1-smooth(clamp((rr-(1-feather))/(2*feather))),light=.6+.4*clamp((1-u-v)*.6),k=j*4;im.data[k]=col[0];im.data[k+1]=col[1];im.data[k+2]=col[2];im.data[k+3]=Math.round(255*boundary*light*.74)}dx.putImageData(im,0,0);cache.set(key,disc);return disc}
function material(i,f){const a=smooth(clamp(f/.16))*smooth(clamp((1-f)/.25));if(a<=0)return;const radius=Math.min(w,h)*(.27+.19*smooth(f)),focus=Math.exp(-Math.pow((f-.48)/.1575,4)),level=focus*16,lo=Math.floor(level),hi=Math.min(16,lo+1),blend=level-lo,s=radius*N/108,left=(w-s)/2,top=(h-s)/2;const low=texture(i,lo);if(hi===lo||blend<.001){x.globalAlpha=a;x.drawImage(low,left,top,s,s)}else{tx.clearRect(0,0,N,N);tx.globalCompositeOperation='source-over';tx.globalAlpha=1-blend;tx.drawImage(low,0,0);tx.globalCompositeOperation='lighter';tx.globalAlpha=blend;tx.drawImage(texture(i,hi),0,0);tx.globalAlpha=1;tx.globalCompositeOperation='source-over';x.globalAlpha=a;x.drawImage(temp,left,top,s,s)}x.globalAlpha=1}
function blob(cx,cy,rx,ry,color,opacity){x.save();x.translate(cx,cy);x.scale(rx,ry);const g=x.createRadialGradient(0,0,.04,0,0,1);g.addColorStop(0,`rgba(${color},${opacity})`);g.addColorStop(.3,`rgba(${color},${opacity*.96})`);g.addColorStop(.58,`rgba(${color},${opacity*.65})`);g.addColorStop(.82,`rgba(${color},${opacity*.22})`);g.addColorStop(1,`rgba(${color},0)`);x.fillStyle=g;x.fillRect(-1,-1,2,2);x.restore()}
function draw(){if(!w)return;x.setTransform(d,0,0,d,0,0);x.globalAlpha=1;x.fillStyle=`rgb(${mix([230,237,243],[250,246,223],p).join(',')})`;x.fillRect(0,0,w,h);blob(w*(.15+.38*Math.sin(p*4)),h*(.82-.46*p),w*.98,h*.58,'30,128,218',.96-.35*p);blob(w*(.18+.45*p),h*(.56-.13*Math.sin(p*6)),w*.83,h*.47,'35,35,119',.94*(1-p*.8));blob(w*(.06+.65*p),h*(.38+.16*Math.sin(p*5)),w*.93,h*.48,'239,37,55',.93);blob(w*(.1+.55*Math.sin(p*2)),h*(.19+.47*p),w*.76,h*.43,'255,137,19',.94);blob(w*(.85-.38*p),h*(.85-.63*p),w*.85,h*.53,'255,218,95',p*.9);blob(w*(.92-.25*Math.sin(p*4)),h*(.17+.5*p),w*.77,h*.78,'251,249,239',.95);
const q=Math.min(total-1e-8,p*total),i=scenes.findIndex(s=>q<s.start+s.length),scene=scenes[Math.max(0,i)],f=clamp((q-scene.start)/scene.length);if(scene.kind==='verse')material(i-3,f);x.globalCompositeOperation='soft-light';x.fillStyle=pattern;x.fillRect(0,0,w,h);x.globalCompositeOperation='source-over';const alpha=scene.text?Math.min(1,i===0?1:f/.08,(1-f)/.08):0;if(label.textContent!==scene.text){label.textContent=scene.text;words.className=scene.kind}words.style.opacity=String(clamp(alpha));}
function schedule(){if(!raf)raf=requestAnimationFrame(tick)}function tick(now){raf=0;const dt=last?Math.min(50,now-last):16;last=now;p+=(target-p)*(1-Math.exp(-dt/38));if(Math.abs(target-p)<.00004)p=target;draw();if(p!==target)schedule();else last=0}function update(){target=clamp(r.scrollTop/Math.max(1,r.scrollHeight-r.clientHeight));schedule()}function resize(){w=r.clientWidth;h=r.clientHeight;d=Math.min(devicePixelRatio||1,2);if(w!==lastW||!lastW){space.style.height=Math.round(h+total*h*.82)+'px';lastW=w}c.width=Math.round(w*d);c.height=Math.round(h*d);pattern=x.createPattern(noise,'repeat');update();draw()}
r.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',resize);resize();
</script></body></html>
