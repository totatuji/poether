<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>自分の領域について</title><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap" rel="stylesheet"><style>html,body{margin:0;background:white}body{height:15000px;height: max(15000px,1800vh)}canvas{position:fixed;inset:0;width:100%;height:100%;display:block} </style></head><body><canvas id="c" aria-label="自分の領域について 久世孝臣"></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),ink='#1f2778',white='#fff';let w,h,d,p=0,target=0,raf=0;const clamp=v=>Math.max(0,Math.min(1,v));const rand=Array.from({length:8},()=>({stretch:.78+Math.random()*.44,rot:Math.random()*6.28,sx:(Math.random()-.5)*.2,sy:(Math.random()-.5)*.2,h:[2,3,4,5,7].map(n=>[n,.025+Math.random()*.10,Math.random()*6.28])}));
function contour(r,age,k){const path=new Path2D(),v=rand[k];for(let j=0;j<=240;j++){let a=j*Math.PI/120,rr=k===0?r*(1+.15*Math.sin(a*3+age*.65)+.09*Math.cos(a*5-age*.4)+.05*Math.sin(a*7)):r*(1+v.h.reduce((s,[n,b,f])=>s+b*Math.sin(n*a+f+age*.35),0));let xx=rr*Math.cos(a),yy=rr*Math.sin(a);if(k){xx*=v.stretch;let u=xx*Math.cos(v.rot)-yy*Math.sin(v.rot);yy=xx*Math.sin(v.rot)+yy*Math.cos(v.rot);xx=u+r*v.sx;yy+=r*v.sy}j?path.lineTo(w/2+xx,h/2+yy):path.moveTo(w/2+xx,h/2+yy)}path.closePath();return path}
const words=['食材じゃなくて','それはもう自分なの。','家にある時点で','これから食べるんだから。','だから大事にするのよ。','それはきゅうりとか','にんじんとかじゃなくて、','そとに出てる','自分なのよ'];
function draw(){x.setTransform(d,0,0,d,0,0);x.fillStyle=white;x.fillRect(0,0,w,h);let paths=[],time=p*5.4+.55;for(let k=0;k<8;k++){let age=time-k;if(age<=0)continue;let path=contour(age*Math.max(110,w*.36),age,k);paths.push([path,k%2===0?ink:white]);x.fillStyle=k%2===0?ink:white;x.fill(path)}let text='',alpha=1,size=Math.min(26,w/15);if(p<.04){text='自分の領域について';alpha=clamp((.04-p)/.008)}else if(p>=.047&&p<.085){text='久世孝臣';size=14;alpha=Math.min(1,(p-.047)/.008,(.085-p)/.008)}else if(p>=.103&&p<.83){let q=(p-.103)/.727*words.length,i=Math.min(words.length-1,Math.floor(q)),f=q-i;text=words[i];alpha=Math.min(1,f/.025,(1-f)/.025)}else if(p>=.843&&p<.935){text='POEM — TAKAOMI KUZE\nDESIGN / ILLUSTRATION — TOTA TSUJI';size=Math.min(11,w/35);alpha=Math.min(1,(p-.843)/.01,(.935-p)/.01)}x.globalAlpha=alpha;x.font=`400 ${size}px "Shippori Mincho","Yu Mincho",serif`;x.textAlign='center';x.textBaseline='middle';function write(){text.split('\n').forEach((t,i,a)=>x.fillText(t,w/2,h/2+(i-(a.length-1)/2)*size*1.9,w-30))}x.fillStyle=ink;write();for(const [path,color] of paths){x.save();x.clip(path);x.fillStyle=color===ink?white:ink;write();x.restore()}x.globalAlpha=1}
function tick(){raf=0;p+=(target-p)*.36;if(Math.abs(p-target)<.00008)p=target;draw();if(p!==target)raf=requestAnimationFrame(tick)}function update(){target=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight));if(!raf)raf=requestAnimationFrame(tick)}function resize(){w=innerWidth;h=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*d);c.height=Math.round(h*d);draw();update()}addEventListener('resize',resize);addEventListener('scroll',update,{passive:true});resize();document.fonts.ready.then(draw);
</script></body></html>
