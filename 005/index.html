<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おじいちゃんの名前</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:#1f2778;font-family:DotGothic16,sans-serif}#stage{position:fixed;inset:0;pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%}#word{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.9;white-space:nowrap}#reader{position:fixed;inset:0;overflow:auto;overscroll-behavior:none;scrollbar-width:none}#reader::-webkit-scrollbar{display:none}section{height:var(--step,80svh)}section:last-child{height:var(--end,100svh)}.author{font-size:13px;position:absolute;top:calc(50% + 65px)}@media(prefers-reduced-motion:reduce){canvas{display:none}}
</style></head><body><div id="stage"><canvas id="art" aria-hidden="true"></canvas><div id="word">おじいちゃんの名前</div></div><main id="reader" aria-label="おじいちゃんの名前"></main><script>
const verses=[['おじいちゃんの名前'],['おじいちゃんが死ぬ何年か前、'],['介護が必要なおじいちゃんと','一緒に住むことになったんだ。'],['僕の家がおじいちゃんの家に','引っ越したんだけど、'],['昔は実家とおじいちゃんの家が','別々だったから'],['それぞれの電話番号を','別々に登録してあって、'],['実家は実家。'],['おじいちゃんちは','おじいちゃんの名前で','登録してあったんだけど、'],['もうおじいちゃんは死んで','とっくにいないのに、'],['電話番号の登録を変えるのが','寂しくてそのままにしてあるから'],['実家から電話あるたびに'],['おじいちゃんの名前が','スマホの画面に表示されるんよ'],['それであっおじいちゃんって','毎回思う。'],['おじいちゃんがさ'],['電話帳の中だけでも','生きてるのすごくいいんだよね']];
const reader=document.querySelector('#reader'),word=document.querySelector('#word'),c=document.querySelector('#art'),x=c.getContext('2d'),off=document.createElement('canvas'),m=off.getContext('2d',{willReadFrequently:true});
verses.forEach(()=>{const s=document.createElement('section');s.setAttribute('aria-hidden','true');reader.append(s)});
const N=1500,clamp=v=>Math.max(0,Math.min(1,v)),smooth=v=>v*v*(3-2*v),seeds=Array.from({length:N},()=>({delay:Math.random()*.26,duration:.48+Math.random()*.26,angle:Math.random()*Math.PI*2,r:12+Math.pow(Math.random(),1.4)*100,curve:(Math.random()-.5)*4,phase:Math.random()*6.28,mode:Math.random()}));
let W,H,D,step,shapes=[],p=0,target=0,raf=0,last=0,shown=-1;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function size(i){return Math.min(i===0?40:27,Math.max(16,W*(i===0?.075:.048)),(W-40)/Math.max(...verses[i].map(s=>s.length)))}
function show(i,a){if(shown!==i){word.replaceChildren(...verses[i].map(t=>{const d=document.createElement('div');d.textContent=t;return d}));if(i===0){const d=document.createElement('div');d.className='author';d.textContent='久世孝臣';word.append(d)}shown=i}word.style.fontSize=size(i)+'px';word.style.opacity=a;}
function shape(i){const lines=verses[i],fs=size(i),gap=fs*1.9;m.clearRect(0,0,W,H);m.font=`${fs}px DotGothic16,sans-serif`;m.textAlign='center';m.textBaseline='middle';m.fillStyle='#1f2778';lines.forEach((s,j)=>m.fillText(s,W/2,H/2+(j-(lines.length-1)/2)*gap));const data=m.getImageData(0,0,W,H).data,pts=[];for(let yy=Math.max(0,Math.floor(H/2-gap*lines.length/2-fs));yy<Math.min(H,H/2+gap*lines.length/2+fs);yy++)for(let xx=0;xx<W;xx++)if(data[(yy*W+xx)*4+3]>90)pts.push([xx,yy]);if(!pts.length)pts.push([W/2,H/2]);pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);return Array.from({length:N},(_,j)=>pts[Math.floor(j*pts.length/N)])}
function resize(){const old=step;W=reader.clientWidth;H=reader.clientHeight;if(!W||!H)return;D=Math.min(devicePixelRatio||1,3);step=H*.8;reader.style.setProperty('--step',step+'px');reader.style.setProperty('--end',H+'px');if(old)reader.scrollTop=target*step;c.width=Math.round(W*D);c.height=Math.round(H*D);off.width=W;off.height=H;x.setTransform(D,0,0,D,0,0);shapes=verses.map((_,i)=>shape(i));draw()}
function draw(){if(!shapes.length)return;x.clearRect(0,0,W,H);if(reduced.matches){show(Math.round(p),1);return}const i=Math.min(verses.length-2,Math.floor(p)),f=p-i,t=clamp((f-.18)/.64);if(t===0){show(i,1);return}if(t===1){show(i+1,1);return}show(t<.5?i:i+1,t<.12?1-t/.12:t>.88?(t-.88)/.12:0);const a=shapes[i],b=shapes[i+1];x.fillStyle='#1f2778';x.globalAlpha=Math.min(1,t*10,(1-t)*10);for(let j=0;j<N;j++){const z=seeds[j],u=clamp((t-z.delay)/z.duration),s=smooth(u),e=Math.pow(Math.sin(Math.PI*u),1.5),ang=z.angle+z.curve*u;let dx=Math.cos(ang)*z.r*e,dy=Math.sin(ang)*z.r*e;if(z.mode<.25)dy-=40*e;else if(z.mode<.5)dy+=35*e;else if(z.mode<.75){dx*=.22;dy*=.22}else dx+=Math.sin(u*10+z.phase)*26*e;x.fillRect(a[j][0]*(1-s)+b[j][0]*s+dx,a[j][1]*(1-s)+b[j][1]*s+dy,1,1)}x.globalAlpha=1}
function tick(now){raf=0;const dt=last?Math.min(50,now-last):16;last=now;p+=(target-p)*(1-Math.exp(-dt/180));if(Math.abs(target-p)<.0001)p=target;draw();if(p!==target)raf=requestAnimationFrame(tick);else last=0}
function update(){target=Math.max(0,Math.min(verses.length-1,reader.scrollTop/step));if(!raf)raf=requestAnimationFrame(tick)}
reader.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',()=>{if(reader.clientWidth!==W||Math.abs(reader.clientHeight-H)>100)resize()});resize();if(document.fonts)document.fonts.load('27px DotGothic16',verses.flat().join('')).then(resize).catch(()=>{});
</script></body></html>
